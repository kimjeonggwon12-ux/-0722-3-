<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>구역예배 · TOTOON</title>
    <meta name="description" content="구역예배 코너 — 말씀 보기 · 토툰(좌충우돌 보라의 신앙 성장기) · 사연 남기기">
    <link rel="icon" href="bora.png">
    <link rel="apple-touch-icon" href="bora.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        // 시온 공부방 입장 암호를 통과한 기기만 (루트 index.html의 AUTH_VALUE와 같은 값)
        try { if (localStorage.getItem('sion_auth') !== '2') location.replace('../index.html'); } catch (e) {}
    </script>
    <style>
        :root {
            --paper: #f7f3ec; --ink: #1d1b22; --sub: #6b6577; --line: #e6dfd3;
            --violet: #6c47d9; --violet-d: #4b2f9a; --violet-s: #efe8ff; --lilac: #c9b3f5;
            --green: #00b46b; --red: #ef4444;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; overflow-x: hidden; }
        body { font-family: 'Noto Sans KR', sans-serif; background: var(--paper); color: var(--ink); -webkit-tap-highlight-color: transparent; word-break: keep-all; }
        button { font-family: inherit; cursor: pointer; }
        input, textarea { font-family: inherit; }
        .hidden { display: none !important; }
        .wrap { max-width: 720px; margin: 0 auto; }

        /* 상단 바 */
        .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
                  background: rgba(247,243,236,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
        .topbar a { color: var(--sub); font-weight: 700; font-size: 14px; text-decoration: none; }
        .topbar .t { font-family: 'Jua', sans-serif; font-size: 18px; color: var(--violet-d); }
        .topbar .adm { font-size: 12px; color: #b5aec0; background: none; border: 0; padding: 4px; }
        .topbar .adm.on { color: var(--violet); font-weight: 800; }

        /* 히어로: TOTOON 타이포 */
        .hero { position: relative; overflow: hidden; padding: 26px 16px 22px; text-align: center;
                background:
                  radial-gradient(circle at 12% 20%, rgba(201,179,245,.55) 0 60px, transparent 61px),
                  radial-gradient(circle at 88% 78%, rgba(255,214,102,.45) 0 46px, transparent 47px),
                  repeating-linear-gradient(0deg, transparent 0 23px, rgba(108,71,217,.06) 23px 24px),
                  #fbf8f2; border-bottom: 2px solid var(--ink); }
        .logo { display: inline-flex; align-items: center; gap: 2px; font-family: 'Bagel Fat One', 'Jua', sans-serif; font-size: clamp(40px, 12.5vw, 84px); line-height: 1; letter-spacing: -1px; max-width: 100%; }
        .logo span { display: inline-block; color: var(--violet); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 5px 0 var(--ink); }
        .logo span:nth-child(odd) { transform: rotate(-6deg) translateY(2px); }
        .logo span:nth-child(even) { transform: rotate(5deg) translateY(-3px); }
        .logo span.y { color: #ffd23f; }
        .logo .face { width: .86em; height: .86em; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 4px 5px 0 var(--ink); background: url('bora.png') center/cover; transform: rotate(-4deg) translateY(2px); animation: bob 2.6s ease-in-out infinite; }
        @keyframes bob { 50% { transform: rotate(6deg) translateY(-4px); } }
        .hero .ko { margin-top: 12px; display: inline-block; font-family: 'Jua', sans-serif; font-size: 13px; color: #fff; background: var(--ink); padding: 3px 10px; border-radius: 999px; letter-spacing: .5px; }
        .hero .tag { margin: 10px 0 0; font-family: 'Jua', sans-serif; font-size: clamp(18px, 5vw, 24px); color: var(--ink); }
        .hero .tag b { color: var(--violet); }
        .hero .spark { position: absolute; font-size: 22px; color: var(--violet); opacity: .7; }

        /* 코너 탭 */
        .tabs { position: sticky; top: 49px; z-index: 25; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border-bottom: 1px solid var(--line); }
        .tabs button { border: 0; background: none; padding: 13px 4px 11px; font-size: 15px; font-weight: 800; color: #9a93a6; border-bottom: 3px solid transparent; }
        .tabs button.on { color: var(--ink); border-bottom-color: var(--violet); }
        .panel { padding: 16px; }

        /* 토툰 목록 */
        .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .list-head .cnt { font-size: 13px; color: var(--sub); font-weight: 700; }
        .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 800; color: var(--sub); }
        .chip.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
        .chip.violet { background: var(--violet); color: #fff; border-color: var(--violet); }
        .starter { display: flex; gap: 8px; margin-bottom: 14px; }
        .starter button { flex: 1; border-radius: 12px; padding: 12px 8px; font-size: 14px; font-weight: 900; border: 2px solid var(--ink); background: #fff; box-shadow: 3px 3px 0 var(--ink); }
        .starter button.main { background: var(--violet); color: #fff; }
        .starter button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
        .ep-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
        .ep-row .th { width: 84px; height: 84px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #ece6da; border: 1px solid var(--line); }
        .ep-row .th img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
        .ep-row .info { flex: 1; min-width: 0; }
        .ep-row .no { font-size: 12px; font-weight: 900; color: var(--violet); }
        .ep-row .ti { font-size: 15px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-row .meta { margin-top: 4px; font-size: 12px; color: #a39cae; display: flex; gap: 8px; align-items: center; }
        .ep-row.read .ti, .ep-row.read .no { color: #aaa3b5; }
        .ep-row.read .th { opacity: .55; }
        .badge-up { background: var(--red); color: #fff; font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 4px; }
        .del-mini { margin-left: auto; border: 1px solid #fecaca; color: #dc2626; background: #fff; border-radius: 8px; font-size: 11px; font-weight: 800; padding: 4px 8px; }

        /* 뷰어 */
        .viewer { position: fixed; inset: 0; z-index: 50; background: #fff; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .v-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); background: rgba(255,255,255,.95); border-bottom: 1px solid #eee; }
        .v-top .x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--ink); }
        .v-top .vt { flex: 1; min-width: 0; font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .v-top .pg { font-size: 12px; color: #999; font-weight: 700; }
        .stage { position: relative; max-width: 720px; margin: 0 auto; background: #f4f1ea; touch-action: pan-y; user-select: none; }
        .stage img { width: 100%; display: block; min-height: 200px; }
        .stage .loading { padding: 120px 0; text-align: center; color: #999; font-weight: 700; }
        .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(255,255,255,.92); font-size: 24px; font-weight: 900; color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 2px 3px 0 var(--ink); }
        .arrow.l { left: 8px; } .arrow.r { right: 8px; }
        .arrow:disabled { opacity: .2; }
        .v-nav { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 12px 16px; border-bottom: 8px solid #f3f0ea; }
        .v-nav button { border: 1px solid #ddd; background: #fff; border-radius: 10px; padding: 11px 8px; font-weight: 800; font-size: 14px; color: var(--ink); }
        .v-nav button:disabled { color: #ccc; }
        .v-nav .mid { padding: 11px 16px; background: var(--ink); color: #fff; border-color: var(--ink); }
        .swipe-hint { text-align: center; font-size: 11px; color: #b0aab9; padding: 6px 0 0; }

        /* 댓글 (네이버 웹툰식) */
        .cmt { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
        .cmt h3 { margin: 0 0 12px; font-size: 16px; font-weight: 900; }
        .cmt h3 em { font-style: normal; color: var(--green); }
        .c-form { border: 1px solid #ddd; border-radius: 12px; padding: 10px 12px; background: #fff; }
        .c-form .nm { border: 0; border-bottom: 1px dashed #e5e5e5; width: 100%; padding: 4px 0 8px; font-size: 13px; font-weight: 700; outline: none; }
        .c-form textarea { width: 100%; border: 0; resize: none; height: 72px; padding: 8px 0; font-size: 14px; outline: none; line-height: 1.5; }
        .c-form .row { display: flex; justify-content: space-between; align-items: center; }
        .c-form .len { font-size: 12px; color: #aaa; }
        .c-form .send { border: 0; background: var(--green); color: #fff; font-weight: 900; padding: 8px 18px; border-radius: 8px; font-size: 13px; }
        .c-form .send:disabled { background: #cfcfcf; }
        .c-tabs { display: flex; gap: 14px; margin: 18px 0 6px; border-bottom: 1px solid #eee; }
        .c-tabs button { border: 0; background: none; padding: 8px 0; font-size: 14px; font-weight: 800; color: #aaa; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .c-tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
        .c-item { padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
        .c-item .who { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
        .c-item .best { background: var(--red); color: #fff; font-size: 10px; font-weight: 900; padding: 1px 5px; border-radius: 3px; }
        .c-item .mine { color: var(--violet); font-size: 11px; font-weight: 800; }
        .c-item .txt { margin: 6px 0 8px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        .c-item .bot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
        .c-item .bot .sp { flex: 1; }
        .vote { border: 1px solid #e5e5e5; background: #fff; border-radius: 6px; padding: 3px 9px; font-size: 12px; color: #777; font-weight: 700; }
        .vote.on.like { border-color: var(--red); color: var(--red); }
        .vote.on.dislike { border-color: #555; color: #333; }
        .c-del { border: 0; background: none; color: #bbb; font-size: 12px; padding: 2px 4px; }
        .c-empty { text-align: center; color: #aaa; padding: 30px 0; font-size: 14px; }

        /* 말씀 보기 */
        .word-card { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
        .word-card .ic { width: 48px; height: 48px; border-radius: 12px; background: var(--violet-s); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .word-card .t { font-weight: 900; font-size: 15px; }
        .word-card .d { font-size: 12px; color: #a39cae; margin-top: 3px; }
        .empty { text-align: center; padding: 40px 16px; color: var(--sub); }
        .empty img { width: 92px; height: 92px; border-radius: 50%; display: block; margin: 0 auto 12px; }
        .empty b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 4px; }
        .word-pages img { width: 100%; display: block; border-bottom: 1px solid #eee; }

        /* 사연 남기기 */
        .story-intro { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--ink); border-radius: 16px; padding: 14px; box-shadow: 4px 4px 0 var(--ink); margin-bottom: 18px; }
        .story-intro img { width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0; }
        .story-intro p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--sub); }
        .story-intro p b { color: var(--ink); font-size: 15px; display: block; margin-bottom: 2px; font-family: 'Jua', sans-serif; font-weight: 400; }
        .f-lab { display: block; font-size: 13px; font-weight: 800; margin: 12px 0 6px; }
        .f-lab small { color: #aaa; font-weight: 500; }
        .f-in { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 15px; background: #fff; outline: none; }
        .f-in:focus { border-color: var(--violet); }
        textarea.f-in { min-height: 180px; resize: vertical; line-height: 1.6; }
        .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .f-check { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0; font-size: 13px; color: var(--sub); line-height: 1.5; }
        .f-check input { width: 18px; height: 18px; accent-color: var(--violet); margin-top: 1px; flex-shrink: 0; }
        .btn-big { width: 100%; border: 2px solid var(--ink); background: var(--violet); color: #fff; font-size: 16px; font-weight: 900; padding: 14px; border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }
        .btn-big:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
        .btn-big:disabled { opacity: .5; }
        .note { font-size: 12px; color: #a39cae; text-align: center; margin-top: 10px; line-height: 1.5; }

        /* 띵! */
        .ding { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: rgba(29,27,34,.45); }
        .ding .box { background: #fff; border: 3px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); padding: 26px 24px 20px; text-align: center; width: min(86vw, 320px); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
        .ding .bell { font-family: 'Bagel Fat One', 'Jua', sans-serif; font-size: 48px; color: var(--violet); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); animation: ring .8s ease-in-out 2; }
        .ding img { width: 72px; height: 72px; border-radius: 50%; margin: 8px auto 4px; display: block; }
        .ding p { margin: 6px 0 14px; font-size: 14px; line-height: 1.6; color: var(--sub); }
        .ding button { border: 0; background: var(--ink); color: #fff; font-weight: 900; padding: 10px 26px; border-radius: 10px; }
        @keyframes pop { from { transform: scale(.4); opacity: 0; } }
        @keyframes ring { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

        /* 모달 (관리자) */
        .modal { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
        .modal .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 20px 18px; padding-bottom: max(20px, env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; }
        @media (min-width: 640px) { .modal { align-items: center; } .modal .sheet { border-radius: 20px; } }
        .modal h4 { margin: 0 0 6px; font-size: 17px; font-weight: 900; }
        .modal .sub { font-size: 12px; color: #999; margin: 0 0 8px; }
        .modal .btns { display: flex; gap: 8px; margin-top: 16px; }
        .modal .btns button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 900; border: 1px solid #ddd; background: #fff; }
        .modal .btns .ok { background: var(--violet); color: #fff; border-color: var(--violet); }
        .prog { font-size: 13px; color: var(--violet); font-weight: 800; margin-top: 10px; min-height: 18px; }
        .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 90; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; max-width: 90vw; text-align: center; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="../index.html">‹ 시온 공부방</a>
        <span class="t">구역예배</span>
        <button type="button" id="adm-btn" class="adm" onclick="openAdmin()">관리</button>
    </div>

    <header class="hero">
        <span class="spark" style="left:8%;top:62%">✦</span>
        <span class="spark" style="right:9%;top:16%">✧</span>
        <div class="logo" aria-label="TOTOON">
            <span>T</span><i class="face" aria-hidden="true"></i><span>T</span><span class="y">O</span><span>O</span><span>N</span>
        </div>
        <div><span class="ko">THOMAS WEBTOON · 토마스 웹툰</span></div>
        <p class="tag">좌충우돌 <b>보라</b>의 신앙 성장기</p>
    </header>

    <nav class="tabs wrap" id="tabs">
        <button type="button" data-tab="word">📖 말씀 보기</button>
        <button type="button" data-tab="toon">🎨 토툰</button>
        <button type="button" data-tab="story">💌 사연 남기기</button>
    </nav>

    <main class="wrap">
        <!-- 말씀 보기 -->
        <section id="panel-word" class="panel hidden">
            <div class="list-head">
                <span class="cnt" id="word-cnt">구역예배 교재</span>
                <button type="button" class="chip violet admin-only hidden" onclick="openUpload('word')">+ 교재 올리기</button>
            </div>
            <div id="word-list"></div>
        </section>

        <!-- 토툰 -->
        <section id="panel-toon" class="panel hidden">
            <div class="starter">
                <button type="button" class="main" id="btn-continue" onclick="openEp(readSet().size ? firstUnreadOrLast() : toons[toons.length - 1].ep)">이어보기</button>
                <button type="button" onclick="openEp(toons[0] && toons[0].ep)">첫화보기</button>
            </div>
            <div class="list-head">
                <span class="cnt" id="toon-cnt"></span>
                <div style="display:flex;gap:6px">
                    <button type="button" class="chip violet admin-only hidden" onclick="openUpload('toon')">+ 새 화 올리기</button>
                    <button type="button" class="chip" id="sort-btn" onclick="toggleSort()">최신화부터</button>
                </div>
            </div>
            <div id="toon-list"></div>
        </section>

        <!-- 사연 남기기 -->
        <section id="panel-story" class="panel hidden">
            <div class="story-intro">
                <img src="bora.png" alt="">
                <p><b>보라에게 신앙 사연을 들려주세요</b>은혜받은 일, 웃픈 일, 고민까지 무엇이든 좋아요. 보내주신 사연은 이 화면에 남지 않고 담당자에게만 전달돼요.</p>
            </div>
            <form id="story-form" onsubmit="submitStory(event)">
                <div class="f-grid">
                    <div><label class="f-lab" for="st-name">이름 <small>(선택)</small></label><input id="st-name" class="f-in" maxlength="30" placeholder="익명 가능"></div>
                    <div><label class="f-lab" for="st-church">교회 <small>(선택)</small></label><input id="st-church" class="f-in" maxlength="30" placeholder="예: 전주"></div>
                </div>
                <label class="f-lab" for="st-dept">부서 <small>(선택)</small></label>
                <input id="st-dept" class="f-in" maxlength="30" placeholder="예: 청년회">
                <label class="f-lab" for="st-title">제목</label>
                <input id="st-title" class="f-in" maxlength="100" placeholder="한 줄로 요약해 주세요">
                <label class="f-lab" for="st-content">사연</label>
                <textarea id="st-content" class="f-in" maxlength="5000" placeholder="자유롭게 적어주세요" required></textarea>
                <label class="f-check"><input type="checkbox" id="st-agree"> 제 사연이 토툰 이야기 소재로 쓰여도 괜찮아요 (이름은 밝히지 않아요)</label>
                <button type="submit" class="btn-big" id="st-send">사연 보내기</button>
                <p class="note">보낸 뒤에는 이 기기에도 남지 않아요.</p>
            </form>
        </section>
    </main>

    <!-- 토툰 뷰어 -->
    <div id="viewer" class="viewer hidden">
        <div class="v-top">
            <button type="button" class="x" onclick="closeViewer()" aria-label="목록으로">‹</button>
            <span class="vt" id="v-title"></span>
            <span class="pg" id="v-pg"></span>
        </div>
        <div class="stage" id="stage">
            <div id="v-img"></div>
            <button type="button" class="arrow l" id="arr-l" onclick="stepEp(-1)" aria-label="이전 화">‹</button>
            <button type="button" class="arrow r" id="arr-r" onclick="stepEp(1)" aria-label="다음 화">›</button>
        </div>
        <p class="swipe-hint">옆으로 밀어도 넘어가요</p>
        <div class="v-nav">
            <button type="button" id="nav-prev" onclick="stepEp(-1)">‹ 이전화</button>
            <button type="button" class="mid" onclick="closeViewer()">목록</button>
            <button type="button" id="nav-next" onclick="stepEp(1)">다음화 ›</button>
        </div>
        <div class="cmt">
            <h3>댓글 <em id="c-count">0</em></h3>
            <div class="c-form">
                <input class="nm" id="c-name" maxlength="20" placeholder="닉네임 (예: 전주 보라)">
                <textarea id="c-text" maxlength="300" placeholder="주제와 무관한 댓글, 비방은 삭제될 수 있어요"></textarea>
                <div class="row"><span class="len"><span id="c-len">0</span>/300</span><button type="button" class="send" id="c-send" onclick="postComment()">등록</button></div>
            </div>
            <div class="c-tabs">
                <button type="button" data-c="best" class="on">BEST 댓글</button>
                <button type="button" data-c="all">전체 댓글</button>
            </div>
            <div id="c-list"></div>
        </div>
    </div>

    <!-- 말씀 교재 뷰어 -->
    <div id="word-viewer" class="viewer hidden">
        <div class="v-top">
            <button type="button" class="x" onclick="history.back()" aria-label="목록으로">‹</button>
            <span class="vt" id="wv-title"></span>
        </div>
        <div class="stage word-pages" id="wv-pages"></div>
    </div>

    <!-- 관리자 -->
    <div id="admin-modal" class="modal hidden" onclick="if(event.target===this)closeModal('admin-modal')">
        <div class="sheet">
            <h4>관리자</h4>
            <p class="sub">시온 공부방 관리자 비밀번호를 입력하면 교재·토툰 올리기와 댓글 삭제를 할 수 있어요.</p>
            <input id="adm-pin" class="f-in" type="password" inputmode="numeric" placeholder="비밀번호">
            <div class="prog" id="adm-msg"></div>
            <div class="btns"><button type="button" onclick="closeModal('admin-modal')">닫기</button><button type="button" class="ok" id="adm-ok" onclick="checkAdmin()">확인</button></div>
        </div>
    </div>

    <div id="upload-modal" class="modal hidden">
        <div class="sheet">
            <h4 id="up-title">올리기</h4>
            <p class="sub" id="up-sub"></p>
            <div id="up-ep-wrap"><label class="f-lab" for="up-ep">회차</label><input id="up-ep" class="f-in" type="number" min="1"></div>
            <label class="f-lab" for="up-name">제목</label>
            <input id="up-name" class="f-in" maxlength="100">
            <label class="f-lab" for="up-file">파일 <small id="up-accept"></small></label>
            <input id="up-file" class="f-in" type="file" multiple>
            <div class="prog" id="up-prog"></div>
            <div class="btns"><button type="button" id="up-cancel" onclick="closeModal('upload-modal')">취소</button><button type="button" class="ok" id="up-ok" onclick="doUpload()">올리기</button></div>
        </div>
    </div>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbXTWcmb4hWpB1MZYLfRpBb_mCpmqgvg3oRav5Kt8C_rdBy_w75jDYE5DC_d8WjwknyQ/exec';

        // 앱에 같이 들어있는 1~30화 (구역예배/toon/epNN.jpg). 이후 화는 관리자 업로드로 서버(토툰파일 시트)에서 받는다.
        const BUNDLED = [
            '참신앙인이 될거야!', '다음엔 시험점수도 100점!', '예배의 품격', '우리의 성전 이야기', '당연한 건 없다는 거!',
            '멋진 우리 집사님', '기도하고 도전!', '멋진 우리 집사님(2)', '멋진 우리 집사님(3)', '마음이 녹는다',
            '마음이 따수워져', '세계가 몰려올 것이라는 말씀', '바통 터치!', '둠칫 둠칫 계시록 공부', '나중되지 않게',
            '일단 해!', '주의 말씀으로 얻어 맞았사오니', '묵묵하게 할 일을 하는 것', '오늘도 우리 식구는 빛난다', '리셋 버튼',
            '지치고 힘든 날', '말씀저장고', '신앙일기', '뭐라도 하자!', '계시록 통달 자격증 시험',
            '가을맞이', '티끌을 차곡차곡', '영화의 한 씬', '추석, 똑똑', '짠하고 장하다'
        ].map((title, i) => ({ ep: i + 1, title, src: 'toon/ep' + String(i + 1).padStart(2, '0') + '.jpg', pages: 1 }));

        let toons = BUNDLED.slice();     // ep 오름차순
        let words = [];                  // 말씀 교재 (최신순)
        let commentCounts = {};
        let sortNewest = true;
        let currentEp = null;
        let comments = [];
        let commentTab = 'best';
        const pageCache = new Map();     // 'id|page' -> dataURL

        function store(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; } }
        function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
        function fmtDate(v) { const d = new Date(v); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
        function isRecent(v) { const d = new Date(v); return !isNaN(d) && Date.now() - d < 7 * 864e5; }

        async function gasCall(payload) {
            try {
                const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                return JSON.parse(await res.text());
            } catch (err) {
                console.error('[GAS]', err);
                return { success: false, offline: true, message: '서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.' };
            }
        }

        /* ---------- 관리자 ---------- */
        function adminKey() { try { return sessionStorage.getItem('totoon_admin') || ''; } catch (e) { return ''; } }
        function applyAdminUI() {
            const on = !!adminKey();
            document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !on));
            const b = document.getElementById('adm-btn'); b.classList.toggle('on', on); b.textContent = on ? '관리 중' : '관리';
        }
        function openAdmin() {
            if (adminKey()) { try { sessionStorage.removeItem('totoon_admin'); } catch (e) {} applyAdminUI(); renderAll(); toast('관리 모드를 껐어요'); return; }
            document.getElementById('adm-msg').textContent = '';
            document.getElementById('admin-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('adm-pin').focus(), 50);
        }
        async function checkAdmin() {
            const pin = document.getElementById('adm-pin').value.trim();
            if (!pin) return;
            const msg = document.getElementById('adm-msg'); msg.textContent = '확인 중…';
            // 존재하지 않는 id로 삭제를 요청해 비밀번호만 검사한다(비밀번호가 맞으면 '잘못된 요청'이 돌아옴).
            const r = await gasCall({ action: 'toonDelete', adminKey: pin, id: '-' });
            if (r && r.message === '잘못된 요청입니다.') {
                try { sessionStorage.setItem('totoon_admin', pin); } catch (e) {}
                closeModal('admin-modal'); applyAdminUI(); renderAll(); toast('관리 모드가 켜졌어요');
            } else {
                msg.textContent = (r && r.offline) ? r.message : '비밀번호가 맞지 않아요.';
            }
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        /* ---------- 탭 ---------- */
        function showTab(name, push) {
            document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
            ['word', 'toon', 'story'].forEach(t => document.getElementById('panel-' + t).classList.toggle('hidden', t !== name));
            save('totoon_tab', name);
            if (push !== false) history.replaceState(null, '', '#' + name);
        }
        document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });

        /* ---------- 토툰 목록 ---------- */
        function readSet() { return new Set(store('totoon_read', [])); }
        function renderToonList() {
            const read = readSet();
            const list = sortNewest ? toons.slice().reverse() : toons;
            document.getElementById('toon-cnt').textContent = `총 ${toons.length}화`;
            document.getElementById('sort-btn').textContent = sortNewest ? '최신화부터 ⇅' : '1화부터 ⇅';
            const isAdm = !!adminKey();
            document.getElementById('toon-list').innerHTML = list.map(t => {
                const thumb = t.src ? `<img src="${t.src}" loading="lazy" alt="">` : `<img data-thumb="${t.id}" alt="">`;
                const cnt = commentCounts['ep' + t.ep] || 0;
                return `<div class="ep-row${read.has(t.ep) ? ' read' : ''}" onclick="openEp(${t.ep})">
                    <div class="th">${thumb}</div>
                    <div class="info">
                        <div class="no">${t.ep}화 ${t.at && isRecent(t.at) ? '<span class="badge-up">UP</span>' : ''}</div>
                        <div class="ti">${esc(t.title)}</div>
                        <div class="meta">${t.at ? '<span>' + fmtDate(t.at).slice(0, 10) + '</span>' : ''}<span>💬 ${cnt}</span>${read.has(t.ep) ? '<span>읽음</span>' : ''}
                        ${isAdm && t.id ? `<button type="button" class="del-mini" onclick="event.stopPropagation();deleteItem('${t.id}','${t.ep}화')">삭제</button>` : ''}</div>
                    </div></div>`;
            }).join('');
            document.querySelectorAll('img[data-thumb]').forEach(async img => { img.src = await getPage(img.dataset.thumb, 0); });
            const next = firstUnreadOrLast();
            document.getElementById('btn-continue').textContent = read.size ? `이어보기 · ${next}화` : `최신화 보기 · ${toons[toons.length - 1].ep}화`;
        }
        function toggleSort() { sortNewest = !sortNewest; renderToonList(); }
        function firstUnreadOrLast() {
            const last = store('totoon_last', 0);
            if (last && toons.some(t => t.ep === last + 1)) return last + 1;
            if (last && toons.some(t => t.ep === last)) return last;
            return toons[0] ? toons[0].ep : 1;
        }

        async function getPage(id, page) {
            const k = id + '|' + page;
            if (pageCache.has(k)) return pageCache.get(k);
            const r = await gasCall({ action: 'toonPage', id, page });
            if (r && r.success) { pageCache.set(k, r.data); return r.data; }
            return '';
        }

        /* ---------- 토툰 뷰어 ---------- */
        function openEp(ep, fromHistory) {
            const t = toons.find(x => x.ep === ep);
            if (!t) return;
            const wasOpen = currentEp !== null;
            currentEp = ep;
            const v = document.getElementById('viewer');
            v.classList.remove('hidden'); v.scrollTop = 0;
            document.body.style.overflow = 'hidden';
            if (!fromHistory) { if (wasOpen) history.replaceState({ ep }, '', '#ep=' + ep); else history.pushState({ ep }, '', '#ep=' + ep); }
            const idx = toons.indexOf(t);
            document.getElementById('v-title').textContent = `${t.ep}화 · ${t.title}`;
            document.getElementById('v-pg').textContent = `${idx + 1} / ${toons.length}`;
            ['arr-l', 'nav-prev'].forEach(id => document.getElementById(id).disabled = idx === 0);
            ['arr-r', 'nav-next'].forEach(id => document.getElementById(id).disabled = idx === toons.length - 1);
            const box = document.getElementById('v-img');
            if (t.src) {
                box.innerHTML = `<img src="${t.src}" alt="${esc(t.ep + '화 ' + t.title)}">`;
            } else {
                box.innerHTML = '<div class="loading">불러오는 중…</div>';
                Promise.all(Array.from({ length: t.pages }, (_, p) => getPage(t.id, p))).then(srcs => {
                    if (currentEp !== ep) return;
                    box.innerHTML = srcs.map(s => s ? `<img src="${s}" alt="">` : '<div class="loading">그림을 불러오지 못했어요</div>').join('');
                });
            }
            // 다음 화 미리 받기
            const nx = toons[idx + 1]; if (nx && nx.src) { const im = new Image(); im.src = nx.src; }
            const read = readSet(); read.add(ep); save('totoon_read', [...read]); save('totoon_last', ep);
            loadComments();
        }
        function stepEp(d) {
            const idx = toons.findIndex(x => x.ep === currentEp);
            const t = toons[idx + d];
            if (t) openEp(t.ep); else toast(d > 0 ? '마지막 화예요. 다음 화를 기다려 주세요!' : '첫 화예요');
        }
        function closeViewer(fromHistory) {
            if (currentEp === null) return;
            currentEp = null;
            document.getElementById('viewer').classList.add('hidden');
            document.body.style.overflow = '';
            if (!fromHistory) history.back();
            renderToonList();
        }
        // 스와이프
        (function () {
            const st = document.getElementById('stage'); let x0 = null, y0 = 0;
            st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
            st.addEventListener('touchend', e => {
                if (x0 === null) return;
                const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
                if (Math.abs(dx) > 60 && Math.abs(dy) < 60) stepEp(dx < 0 ? 1 : -1);
            });
        })();
        document.addEventListener('keydown', e => {
            if (currentEp === null || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
            if (e.key === 'ArrowLeft') stepEp(-1);
            if (e.key === 'ArrowRight') stepEp(1);
            if (e.key === 'Escape') closeViewer();
        });
        window.addEventListener('popstate', () => {
            const m = location.hash.match(/^#ep=(\d+)/);
            if (m) { openEp(Number(m[1]), true); return; }
            if (currentEp !== null) closeViewer(true);
            if (!document.getElementById('word-viewer').classList.contains('hidden')) closeWord();
        });

        /* ---------- 댓글 ---------- */
        function myComments() { return store('totoon_my_comments', {}); }
        function myVotes() { return store('totoon_votes', {}); }
        async function loadComments() {
            const key = 'ep' + currentEp;
            const list = document.getElementById('c-list');
            list.innerHTML = '<div class="c-empty">댓글 불러오는 중…</div>';
            document.getElementById('c-count').textContent = commentCounts[key] || 0;
            const r = await gasCall({ action: 'toonComments', key });
            if ('ep' + currentEp !== key) return;
            if (!r || !r.success) { list.innerHTML = `<div class="c-empty">${esc((r && r.message) || '댓글을 불러오지 못했어요')}</div>`; return; }
            comments = r.rows || [];
            commentCounts[key] = comments.length;
            renderComments();
        }
        function renderComments() {
            document.getElementById('c-count').textContent = comments.length;
            const mine = myComments(), votes = myVotes(), isAdm = !!adminKey();
            const ranked = comments.filter(c => c.likes > 0).sort((a, b) => (b.likes - b.dislikes) - (a.likes - a.dislikes) || b.likes - a.likes);
            const bestIds = new Set(ranked.slice(0, 3).map(c => c.id));
            let rows;
            if (commentTab === 'best') {
                // BEST 3 다음에 나머지를 최신순으로 (네이버 웹툰 기본 화면처럼)
                rows = ranked.slice(0, 3).concat(comments.filter(c => !bestIds.has(c.id)).sort((a, b) => new Date(b.at) - new Date(a.at)));
            } else {
                rows = comments.slice().sort((a, b) => new Date(b.at) - new Date(a.at));
            }
            document.getElementById('c-list').innerHTML = rows.length ? rows.map(c => `
                <div class="c-item">
                    <div class="who">${bestIds.has(c.id) && commentTab === 'best' ? '<span class="best">BEST</span>' : ''}${esc(c.name)}${mine[c.id] ? '<span class="mine">내 댓글</span>' : ''}</div>
                    <div class="txt">${esc(c.content)}</div>
                    <div class="bot"><span>${fmtDate(c.at)}</span><span class="sp"></span>
                        ${mine[c.id] || isAdm ? `<button type="button" class="c-del" onclick="deleteComment('${c.id}')">삭제</button>` : ''}
                        <button type="button" class="vote like${votes[c.id] === 'like' ? ' on' : ''}" onclick="vote('${c.id}','like')">👍 ${c.likes}</button>
                        <button type="button" class="vote dislike${votes[c.id] === 'dislike' ? ' on' : ''}" onclick="vote('${c.id}','dislike')">👎 ${c.dislikes}</button>
                    </div>
                </div>`).join('') : '<div class="c-empty">첫 댓글을 남겨 주세요 😊</div>';
        }
        document.querySelector('.c-tabs').addEventListener('click', e => {
            const b = e.target.closest('button'); if (!b) return;
            commentTab = b.dataset.c;
            document.querySelectorAll('.c-tabs button').forEach(x => x.classList.toggle('on', x === b));
            renderComments();
        });
        const cText = document.getElementById('c-text'), cName = document.getElementById('c-name');
        cName.value = store('totoon_nick', '');
        cText.addEventListener('input', () => { document.getElementById('c-len').textContent = cText.value.length; });
        async function postComment() {
            const content = cText.value.trim();
            const name = cName.value.trim();
            if (!name) { toast('닉네임을 적어 주세요'); cName.focus(); return; }
            if (!content) { toast('댓글을 입력해 주세요'); cText.focus(); return; }
            const btn = document.getElementById('c-send'); btn.disabled = true;
            save('totoon_nick', name);
            const ep = currentEp;
            const r = await gasCall({ action: 'toonCommentPost', key: 'ep' + ep, name, content });
            btn.disabled = false;
            if (!r || !r.success) { toast((r && r.message) || '등록하지 못했어요'); return; }
            const mine = myComments(); mine[r.id] = r.editToken; save('totoon_my_comments', mine);
            cText.value = ''; document.getElementById('c-len').textContent = 0;
            if (currentEp !== ep) return;
            comments.push({ id: r.id, at: new Date().toISOString(), name, content, likes: 0, dislikes: 0 });
            commentCounts['ep' + ep] = comments.length;
            commentTab = 'all'; document.querySelectorAll('.c-tabs button').forEach(x => x.classList.toggle('on', x.dataset.c === 'all'));
            renderComments();
        }
        async function deleteComment(id) {
            const mine = myComments();
            const r = await gasCall({ action: 'toonCommentDelete', id, editToken: mine[id] || '', adminKey: adminKey() });
            if (!r || !r.success) { toast((r && r.message) || '삭제하지 못했어요'); return; }
            delete mine[id]; save('totoon_my_comments', mine);
            comments = comments.filter(c => c.id !== id);
            commentCounts['ep' + currentEp] = comments.length;
            renderComments(); toast('삭제했어요');
        }
        async function vote(id, type) {
            const votes = myVotes(); const c = comments.find(x => x.id === id); if (!c) return;
            const prev = votes[id];
            const field = t => t === 'like' ? 'likes' : 'dislikes';
            const calls = [];
            if (prev) { c[field(prev)] = Math.max(0, c[field(prev)] - 1); calls.push({ type: prev, delta: -1 }); delete votes[id]; }
            if (prev !== type) { c[field(type)] += 1; calls.push({ type, delta: 1 }); votes[id] = type; }
            save('totoon_votes', votes); renderComments();
            for (const k of calls) await gasCall({ action: 'toonCommentVote', id, type: k.type, delta: k.delta });
        }

        /* ---------- 말씀 보기 ---------- */
        function renderWordList() {
            const isAdm = !!adminKey();
            document.getElementById('word-cnt').textContent = words.length ? `구역예배 교재 ${words.length}개` : '구역예배 교재';
            document.getElementById('word-list').innerHTML = words.length ? words.map(w => `
                <div class="word-card" onclick="openWord('${w.id}')">
                    <div class="ic">📖</div>
                    <div style="flex:1;min-width:0"><div class="t">${esc(w.title)} ${isRecent(w.at) ? '<span class="badge-up">NEW</span>' : ''}</div>
                    <div class="d">${fmtDate(w.at).slice(0, 10)} · ${w.pages}쪽</div></div>
                    ${isAdm ? `<button type="button" class="del-mini" onclick="event.stopPropagation();deleteItem('${w.id}','이 교재')">삭제</button>` : ''}
                </div>`).join('') : `<div class="empty"><img src="bora.png" alt=""><b>아직 올라온 교재가 없어요</b>구역예배 교재가 올라오면 여기서 볼 수 있어요.</div>`;
        }
        async function openWord(id) {
            const w = words.find(x => x.id === id); if (!w) return;
            document.getElementById('wv-title').textContent = w.title;
            const box = document.getElementById('wv-pages');
            box.innerHTML = '<div class="loading">불러오는 중…</div>';
            const v = document.getElementById('word-viewer'); v.classList.remove('hidden'); v.scrollTop = 0;
            document.body.style.overflow = 'hidden';
            history.pushState({ word: id }, '', '#word=' + id);
            box.innerHTML = Array.from({ length: w.pages }, (_, p) => `<div data-p="${p}" class="loading">${p + 1}쪽 불러오는 중…</div>`).join('');
            for (let p = 0; p < w.pages; p++) {
                const src = await getPage(id, p);
                const slot = box.querySelector(`[data-p="${p}"]`); if (!slot) return;
                slot.outerHTML = src ? `<img src="${src}" alt="${p + 1}쪽">` : `<div class="loading">${p + 1}쪽을 불러오지 못했어요</div>`;
            }
        }
        function closeWord() { document.getElementById('word-viewer').classList.add('hidden'); document.body.style.overflow = ''; }

        /* ---------- 업로드 (관리자) ---------- */
        let uploadKind = 'toon';
        function openUpload(kind) {
            uploadKind = kind;
            const isToon = kind === 'toon';
            document.getElementById('up-title').textContent = isToon ? '토툰 새 화 올리기' : '구역예배 교재 올리기';
            document.getElementById('up-sub').textContent = isToon ? '4컷 만화 그림(여러 장이면 위에서부터 이어 붙여 보여요)' : 'PDF나 사진을 올리면 한 쪽씩 그림으로 바꿔서 저장해요.';
            document.getElementById('up-ep-wrap').classList.toggle('hidden', !isToon);
            document.getElementById('up-ep').value = (toons.length ? toons[toons.length - 1].ep : 0) + 1;
            const d = new Date();
            document.getElementById('up-name').value = isToon ? '' : `${d.getMonth() + 1}월 ${d.getDate()}일 구역예배`;
            document.getElementById('up-name').placeholder = isToon ? '예: 짠하고 장하다' : '예: 10월 12일 구역예배';
            const f = document.getElementById('up-file'); f.value = ''; f.accept = isToon ? 'image/*' : 'image/*,application/pdf';
            document.getElementById('up-accept').textContent = isToon ? '(그림)' : '(PDF 또는 그림)';
            document.getElementById('up-prog').textContent = '';
            document.getElementById('up-ok').disabled = false;
            document.getElementById('upload-modal').classList.remove('hidden');
        }
        function canvasToJpeg(cv) { return cv.toDataURL('image/jpeg', 0.82); }
        function fitCanvas(src, w, h, maxW) {
            const s = Math.min(1, maxW / w);
            const cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
            const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(src, 0, 0, cv.width, cv.height);
            return cv;
        }
        function loadImageFile(file) {
            return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { res(im); }; im.onerror = rej; im.src = url; });
        }
        async function pdfToPages(file, prog) {
            if (!window.pdfjsLib) throw new Error('PDF 도구를 불러오지 못했어요');
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
            const out = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                prog(`PDF ${i}/${pdf.numPages}쪽 변환 중…`);
                const page = await pdf.getPage(i);
                const vp0 = page.getViewport({ scale: 1 });
                const vp = page.getViewport({ scale: 1400 / vp0.width });
                const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
                const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
                await page.render({ canvasContext: ctx, viewport: vp }).promise;
                out.push(canvasToJpeg(cv));
            }
            return out;
        }
        async function doUpload() {
            const files = [...document.getElementById('up-file').files];
            const title = document.getElementById('up-name').value.trim();
            const ep = Number(document.getElementById('up-ep').value) || 0;
            const prog = m => { document.getElementById('up-prog').textContent = m; };
            if (!title) { prog('제목을 적어 주세요'); return; }
            if (!files.length) { prog('파일을 골라 주세요'); return; }
            if (uploadKind === 'toon' && toons.some(t => t.ep === ep)) { prog(`${ep}화는 이미 있어요. 회차를 확인해 주세요`); return; }
            const okBtn = document.getElementById('up-ok'); okBtn.disabled = true;
            try {
                const pages = [];
                for (const f of files) {
                    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) pages.push(...await pdfToPages(f, prog));
                    else { prog(`${f.name} 줄이는 중…`); const im = await loadImageFile(f); pages.push(canvasToJpeg(fitCanvas(im, im.naturalWidth, im.naturalHeight, 1400))); }
                }
                prog(`서버에 올리는 중… (${pages.length}장)`);
                const r = await gasCall({ action: 'toonUpload', adminKey: adminKey(), kind: uploadKind, ep, title, pages });
                if (!r || !r.success) { prog((r && r.message) || '올리지 못했어요'); okBtn.disabled = false; return; }
                pages.forEach((d, p) => pageCache.set(r.id + '|' + p, d));
                closeModal('upload-modal'); toast('올렸어요!');
                await loadServer();
            } catch (err) {
                console.error(err); prog('처리 중 오류: ' + (err.message || err)); okBtn.disabled = false;
            }
        }
        async function deleteItem(id, label) {
            if (!confirmInline(`${label}을(를) 삭제할까요?`)) return;
            const r = await gasCall({ action: 'toonDelete', adminKey: adminKey(), id });
            if (!r || !r.success) { toast((r && r.message) || '삭제하지 못했어요'); return; }
            toast('삭제했어요'); await loadServer();
        }
        // 브라우저 confirm 대신 두 번 누르기로 확인 (3초 안에 한 번 더)
        let pendingConfirm = null;
        function confirmInline(msg) {
            if (pendingConfirm === msg) { pendingConfirm = null; return true; }
            pendingConfirm = msg; toast(msg + ' 한 번 더 누르면 삭제돼요');
            setTimeout(() => { if (pendingConfirm === msg) pendingConfirm = null; }, 3000);
            return false;
        }

        /* ---------- 사연 남기기 ---------- */
        async function submitStory(e) {
            e.preventDefault();
            const val = id => document.getElementById(id).value.trim();
            const content = val('st-content');
            if (!content) { toast('사연을 적어 주세요'); return; }
            const btn = document.getElementById('st-send'); btn.disabled = true; btn.textContent = '보내는 중…';
            const r = await gasCall({ action: 'story', name: val('st-name'), church: val('st-church'), department: val('st-dept'), title: val('st-title'), content, agree: document.getElementById('st-agree').checked });
            btn.disabled = false; btn.textContent = '사연 보내기';
            if (!r || !r.success) { toast((r && r.message) || '보내지 못했어요. 다시 시도해 주세요'); return; }
            document.getElementById('story-form').reset();
            ding();
        }
        function ding() {
            try {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                [[1318.5, 0], [1760, .12]].forEach(([f, t]) => {
                    const o = ac.createOscillator(), g = ac.createGain();
                    o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
                    g.gain.setValueAtTime(0.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.35, ac.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 1.1);
                    o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 1.2);
                });
            } catch (e) {}
            const d = document.createElement('div'); d.className = 'ding';
            d.innerHTML = '<div class="box"><div class="bell">띵!</div><img src="bora.png" alt=""><p>사연이 잘 전달됐어요.<br>소중한 이야기 고마워요!</p><button type="button">확인</button></div>';
            d.addEventListener('click', ev => { if (ev.target === d || ev.target.tagName === 'BUTTON') d.remove(); });
            document.body.appendChild(d);
        }

        /* ---------- 서버 목록 ---------- */
        async function loadServer() {
            const r = await gasCall({ action: 'toonList' });
            if (!r || !r.success) return;
            commentCounts = r.counts || {};
            const up = (r.items || []).filter(i => i.kind === 'toon' && i.ep).map(i => ({ ep: i.ep, title: i.title, id: i.id, pages: i.pages, at: i.at }));
            toons = BUNDLED.filter(b => !up.some(u => u.ep === b.ep)).concat(up).sort((a, b) => a.ep - b.ep);
            words = (r.items || []).filter(i => i.kind === 'word').sort((a, b) => new Date(b.at) - new Date(a.at));
            renderAll();
        }
        function renderAll() { renderToonList(); renderWordList(); if (currentEp !== null) renderComments(); }

        /* ---------- 시작 ---------- */
        applyAdminUI();
        renderAll();
        (function boot() {
            const h = location.hash;
            const m = h.match(/^#ep=(\d+)/);
            if (m) { showTab('toon', false); history.replaceState(null, '', '#toon'); openEp(Number(m[1])); }
            else showTab(['word', 'toon', 'story'].includes(h.slice(1)) ? h.slice(1) : store('totoon_tab', 'toon'));
        })();
        loadServer();
    </script>
</body>
