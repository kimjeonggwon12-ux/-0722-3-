<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요한계시록 완벽 암기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <!-- PDF 생성을 위한 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* 산뜻한 민트/에메랄드 테마 — 아이보리 배경과 어울리도록 살짝 톤을 낮춤 */
            --bg-gradient-start: #eef7ee; /* 기존 teal-50보다 따뜻한 민트 */
            --bg-gradient-end: #faf3e4;   /* 카드와 같은 계열의 따뜻한 크림 */
            --card-bg: #faf5ea;           /* 완전 흰색 대신 은은한 아이보리 톤 (야간 학습 눈부심 완화) */
            --primary-color: #0d9488;     /* teal-600 */
            --primary-hover: #0f766e;     /* teal-700 */
            --text-main: #1e293b;         /* slate-800, 기존보다 한 단계 더 진하게 */
            --text-sub: #64748b;          /* slate-500 */
            --soft-white: #fffaf0;        /* 민트 버튼 위 글자 등에 쓰는, 눈부심을 줄인 아이보리빛 흰색 */
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-main);
        }
        /* 카드/입력창 등 흰색 배경을 전부 아이보리 톤으로, 민트색 옅은 박스와 버튼 글자색도
           같은 톤으로 맞춰 전체가 조화롭게 보이도록 함 (디자인·레이아웃은 그대로 두고 색만 조정
           — Tailwind CDN 유틸리티는 레이어에 속해 있어 레이어 밖에 있는 이 규칙이 소스 순서와
           무관하게 항상 우선 적용됨) */
        .bg-white,
        .focus\:bg-white:focus {
            background-color: var(--card-bg) !important;
        }
        .text-slate-700 {
            color: var(--text-main) !important;
        }
        .text-white {
            color: var(--soft-white) !important;
        }
        .bg-teal-50,
        .hover\:bg-teal-50:hover {
            background-color: #eef6ee !important;
        }
        .bg-teal-100,
        .hover\:bg-teal-100:hover {
            background-color: #e2efe0 !important;
        }
        .bg-emerald-50 {
            background-color: #eaf5e6 !important;
        }
        .from-teal-50 {
            --tw-gradient-from: #eef6ee !important;
        }
        .cursive {
            font-family: 'Nanum Pen Script', cursive;
        }
        .highlight-red {
            color: #ef4444; /* red-500 */
            font-weight: bold;
            background-color: #fee2e2; /* red-100 */
            border-radius: 4px;
            padding: 0 3px;
            text-decoration: line-through;
        }
        .highlight-blue {
            color: #2563eb; /* blue-600 */
            font-weight: bold;
            background-color: #dbeafe; /* blue-100 */
            border-radius: 4px;
            padding: 0 3px;
        }
        /* Style for auto-resizing textareas in chapter mode */
        .chapter-verse-input {
            overflow-y: hidden;
            background-color: #f8fafc; /* slate-50 */
        }
        .chapter-verse-input:focus {
            background-color: #ffffff;
        }
        
        .verse-number-marker {
            position: relative;
            display: inline-block;
            padding: 2px 4px;
            transition: all 0.3s ease;
        }

        .verse-number-marker.correct::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 4px);
            border: 2px solid #10b981; /* emerald-500 */
            border-radius: 50%;
            opacity: 0.8;
            transform: rotate(-10deg);
            box-sizing: border-box;
            animation: draw-circle 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .verse-number-marker.incorrect::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -2px;
            width: 0;
            height: 2px;
            background-color: #ef4444; /* red-500 */
            transform: rotate(15deg);
            opacity: 0.8;
            animation: draw-line 0.3s ease-out forwards;
        }
        
        /* 빈칸 채우기 스타일 */
        .blank-input {
            border: none;
            border-bottom: 2px solid #cbd5e1; /* slate-300 */
            background-color: transparent;
            text-align: center;
            font-weight: bold;
            color: var(--text-main);
            padding: 0 4px;
            margin: 0 2px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: inherit;
            border-radius: 2px;
        }
        .blank-input:focus {
            border-bottom-color: var(--primary-color);
            background-color: #f0fdfa; /* teal-50 */
        }
        .blank-input::placeholder {
            color: #cbd5e1;
            letter-spacing: 2px;
        }
        .blank-input.correct {
            color: #059669; /* emerald-600 */
            border-bottom-color: #10b981; /* emerald-500 */
            background-color: #ecfdf5; /* emerald-50 */
        }
        .blank-input.incorrect {
            color: #dc2626; /* red-600 */
            border-bottom-color: #ef4444; /* red-500 */
            background-color: #fef2f2; /* red-50 */
            animation: shake 0.3s ease-in-out;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes mockExamShortcutPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.45), 0 8px 20px rgba(234, 88, 12, 0.2); }
            50% { box-shadow: 0 0 0 10px rgba(234, 88, 12, 0), 0 8px 20px rgba(234, 88, 12, 0.2); }
        }
        .mock-exam-shortcut { animation: mockExamShortcutPulse 1.8s ease-in-out infinite; }
        
        @keyframes draw-circle {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(-90deg);
                border-color: transparent;
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(-10deg);
                border-color: #10b981;
            }
        }
        
        @keyframes draw-line {
            from {
                width: 0;
            }
            to {
                width: calc(100% + 4px);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 큰 화면(노트북) 레이아웃 스위치 — 계시록 통달/초중고 신학과 같은 목적.
           기존 세로형(모바일) 레이아웃 클래스(max-w-5xl 등)는 그대로 두고, layout-desktop 클래스가
           붙었을 때만 !important로 덮어써서 기존 모바일 레이아웃 코드는 건드리지 않는다. */
        .layout-toggle-neon-pulse { animation: layoutToggleNeonPulse 1.6s ease-in-out infinite; }
        @keyframes layoutToggleNeonPulse {
            0%, 100% { box-shadow: 0 0 6px 1px rgba(13,148,136,0.6), 0 0 0 0 rgba(13,148,136,0.55); border-color: #5eead4; }
            50% { box-shadow: 0 0 18px 5px rgba(45,212,191,0.95), 0 0 0 9px rgba(13,148,136,0); border-color: #2dd4bf; }
        }
        #main-app.layout-desktop {
            max-width: min(1800px, 92vw) !important;
        }
        /* 절/장 암송 화면 안 본문·입력칸·채점 결과는 과목마다 글자 크기 클래스가 제각각이라
           개별 클래스를 일일이 덮어쓰는 대신 전체를 zoom으로 확대한다. */
        #main-app.layout-desktop #memorize-section {
            zoom: 1.3;
        }
        /* 글자 크기 조절(돋보기 버튼): 화면 전체를 zoom으로 확대 */
        body.font-scale-1 #main-app { zoom: 1.15; }
        body.font-scale-2 #main-app { zoom: 1.3; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 md:p-6">
    <!-- 글자 크기 조절: 화면 어디서나 항상 눌리는 고정 버튼(기본/크게/아주 크게 3단계) -->
    <div id="font-scale-control" class="fixed top-2 right-2 z-[9999] flex items-center gap-1.5 bg-white/95 backdrop-blur rounded-full shadow-lg border border-slate-200 px-1.5 py-1.5">
        <button type="button" onclick="changeFontScale(-1)" aria-label="글자 작게" class="w-11 h-11 flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 active:scale-90 transition-transform text-[15px] font-black">🔍-</button>
        <button type="button" onclick="resetFontScale()" aria-label="글자 크기 초기화" class="w-11 h-11 flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 active:scale-90 transition-transform text-[10px] font-black leading-tight">초기화</button>
        <button type="button" onclick="changeFontScale(1)" aria-label="글자 크게" class="w-11 h-11 flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 active:scale-90 transition-transform text-[15px] font-black">🔍+</button>
    </div>
    <script src="../font-scale-drag.js"></script>

    <div id="main-app" class="relative w-full max-w-5xl bg-white rounded-3xl shadow-2xl p-4 sm:p-6 md:p-10 border border-slate-100">
        <!-- Header -->
        <div class="mb-5 flex items-center justify-between gap-2">
            <a href="../index.html#rooms" class="inline-flex items-center gap-1 bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-700 rounded-full px-3 py-1.5 text-xs font-bold transition-colors" title="홈 화면으로">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                홈 화면으로
            </a>
            <button type="button" id="layout-toggle-btn" onclick="toggleMemoRoomLayout()" class="layout-toggle-neon-pulse inline-flex items-center gap-1 bg-white border-2 border-teal-200 text-teal-700 rounded-full px-3 py-1.5 text-xs font-black transition-colors flex-shrink-0"><span id="layout-toggle-icon">🖥️</span><span id="layout-toggle-label"> 큰 화면</span></button>
        </div>

        <!-- 장 전체 암송 채점 기록 (이 기기 localStorage 기준) -->
        <div id="memo-room-history-section" class="hidden mb-6 bg-white border-2 border-teal-100 rounded-2xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2">
                <p class="text-[11px] font-black text-slate-400">📅 최근 장 전체 암송 기록 (이 기기 기준)</p>
                <button onclick="clearMemoRoomChapterHistory()" class="text-[10px] text-slate-300 hover:text-rose-500 font-bold transition-colors">전체 삭제</button>
            </div>
            <div id="memo-room-history-list" class="space-y-1.5"></div>
        </div>

        <!-- Controls -->
        <div class="space-y-8 mb-10">
            <div class="flex flex-col gap-6 items-center justify-center">
                
                <!-- Mode Toggle -->
                <div class="flex items-center justify-center p-1.5 bg-slate-100 rounded-full shadow-inner">
                    <button id="verse-mode-btn" class="px-4 py-2 sm:px-8 sm:py-3 text-sm sm:text-lg rounded-full font-bold transition-all duration-300">절별 암송</button>
                    <button id="chapter-mode-btn" class="px-4 py-2 sm:px-8 sm:py-3 text-sm sm:text-lg rounded-full font-bold transition-all duration-300">장 전체 암송</button>
                </div>

                <!-- Chapter Navigation -->
                <div id="chapter-selection-area" class="flex gap-2 sm:gap-3 items-center w-full max-w-sm">
                    <button id="prev-chapter-btn" title="이전 장" class="p-2.5 sm:p-3.5 flex-shrink-0 text-teal-600 bg-teal-50 hover:bg-teal-100 hover:text-teal-700 rounded-2xl transition disabled:opacity-30 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>

                    <div class="relative flex-grow min-w-0">
                        <select id="chapter-select" class="appearance-none w-full p-3 pr-9 sm:p-4 sm:pr-12 text-base sm:text-lg font-bold text-slate-700 bg-white border-2 border-teal-200 rounded-2xl shadow-sm focus:border-teal-500 focus:ring-4 focus:ring-teal-100 focus:outline-none transition cursor-pointer">
                            <option value="">-- 장 선택 --</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-2 sm:px-4 pointer-events-none text-teal-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="sm:w-6 sm:h-6"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                    </div>

                    <button id="next-chapter-btn" title="다음 장" class="p-2.5 sm:p-3.5 flex-shrink-0 text-teal-600 bg-teal-50 hover:bg-teal-100 hover:text-teal-700 rounded-2xl transition disabled:opacity-30 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
            
            <!-- Verse Selection Grid -->
            <div id="verse-selection-container" class="hidden border-t border-slate-100 pt-8 animate-fade-in">
                <label class="block text-lg font-bold text-center mb-5 text-slate-600">바로갈 절 선택</label>
                <div id="verse-selection-grid" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2.5">
                    <!-- Verse buttons will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <a href="../index.html#memorize-grade" class="mock-exam-shortcut w-full rounded-3xl p-4 flex items-center shadow-lg text-left border-4 border-orange-400 relative overflow-hidden mb-8 no-underline" style="background: linear-gradient(135deg, #fff7ed, #ffedd5);">
            <span class="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] font-black px-2.5 py-1 rounded-bl-xl shadow-sm">급수별 모의고사</span>
            <div class="w-14 h-14 rounded-2xl text-white flex items-center justify-center text-2xl shadow-sm shrink-0" style="background: linear-gradient(135deg, #fdba74, #ea580c);">🎯</div>
            <div class="flex-grow ml-4">
                <div class="text-slate-800 text-[16px] font-black leading-tight">계시록 암기 자격증<br>급수별 모의고사</div>
                <div class="text-orange-700 text-[12px] font-bold mt-1">4급 계1~5장·3급 계1~10장·2급 계1~16장·1급 계1~22장</div>
            </div>
            <div class="w-10 h-10 rounded-full bg-white text-orange-600 flex items-center justify-center shrink-0 shadow-sm">
                <svg class="w-5 h-5 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </div>
        </a>

        <!-- Memorization Section -->
        <main id="memorize-section" class="hidden space-y-8 animate-fade-in">
            <!-- Verse/Chapter Info Card -->
            <div class="bg-slate-50/80 p-3 sm:p-6 rounded-2xl border border-slate-100">
                <div class="flex justify-between items-center flex-wrap gap-3">
                    <div class="flex items-center gap-2 sm:gap-4 flex-wrap">
                        <div class="flex flex-col">
                            <h2 id="verse-title" class="text-lg sm:text-3xl font-bold text-teal-800 tracking-tight"></h2>
                            <p id="verse-subtitle" class="text-sm text-slate-500 font-medium hidden mt-1"></p>
                        </div>

                        <!-- Score Badge -->
                        <div id="score-display" class="hidden text-center bg-white px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border border-teal-100 shadow-sm flex items-center gap-2 sm:gap-3">
                            <div class="flex flex-col">
                                <span class="text-[10px] sm:text-xs text-slate-400 font-bold uppercase tracking-wider">점수</span>
                                <span class="text-base sm:text-2xl font-bold text-teal-600"><span id="score-value">0</span>점</span>
                            </div>
                            <div class="h-8 w-px bg-slate-100"></div>
                            <div class="text-[10px] sm:text-xs text-slate-500 text-left">
                                <span class="block"><span id="correct-count" class="font-bold text-emerald-600">0</span> 정답</span>
                                <span class="block"><span id="total-count" class="font-bold text-slate-600">0</span> 전체</span>
                            </div>
                        </div>

                        <!-- Timer Badge -->
                        <div id="timer-display" class="hidden text-center bg-white px-2.5 py-1.5 sm:px-4 sm:py-2 rounded-xl border border-sky-100 shadow-sm flex items-center gap-2 sm:gap-3">
                             <div class="flex flex-col">
                                <span class="text-[10px] sm:text-xs text-slate-400 font-bold uppercase tracking-wider">시간</span>
                                <span class="text-base sm:text-2xl font-bold text-sky-600"><span id="timer-value">0:00</span></span>
                            </div>
                        </div>

                        <div id="chapter-message-area" class="hidden">
                            <p id="chapter-instruction" class="text-slate-500 text-xs sm:text-sm font-medium">전문을 쓰고 엔터를 누르면 채점이 됩니다.</p>
                            <p id="chapter-encouragement" class="hidden text-teal-600 font-bold text-lg sm:text-2xl"></p>
                        </div>

                         <!-- PDF Download Button -->
                        <div id="pdf-download-container" class="hidden">
                            <button id="download-pdf-btn" class="px-3 py-2 sm:px-5 sm:py-2.5 text-sm sm:text-base bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold transition shadow-lg shadow-emerald-200 flex items-center gap-2 disabled:bg-emerald-300">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                <span>결과 저장</span>
                            </button>
                        </div>
                    </div>
                    <button id="toggle-original-btn" class="px-3 py-2 sm:px-5 sm:py-2.5 text-sm sm:text-base bg-white border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 hover:border-slate-300 hover:text-slate-800 transition font-semibold shadow-sm">원문 보기</button>
                </div>
                <div id="original-text-container" class="hidden mt-6 p-4 sm:p-6 bg-amber-50/50 border border-amber-100 rounded-xl">
                    <div id="chapter-audio-bar" class="hidden items-center gap-2 flex-wrap mb-4 pb-4 border-b border-amber-200">
                        <button id="chapter-audio-play-btn" class="flex-shrink-0 flex items-center gap-1.5 bg-teal-600 hover:bg-teal-700 text-white text-xs font-black px-3 py-1.5 rounded-lg transition shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            <span>장 전체 듣기</span>
                        </button>
                        <button id="chapter-audio-stop-btn" class="flex-shrink-0 flex items-center gap-1.5 bg-white hover:bg-slate-100 text-slate-600 text-xs font-black px-2.5 py-1.5 rounded-lg border border-slate-300 transition">
                            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>
                            <span>정지</span>
                        </button>
                        <span id="chapter-audio-status" class="flex-grow text-xs font-bold text-teal-700 truncate">차분한 목소리로 전체를 이어 읽어드려요</span>

revelationData.forEach(chapter => {
    chapter.verses.forEach(verse => {
        verse.text = verse.text
            .replace(/지어다/g, '찌어다')
            .replace(/지니라/g, '찌니라')
            .replace(/알지라/g, '알찌라')
            .replace(/있을지로다/g, '있을찌로다')
            .replace(/아니할지니/g, '아니할찌니')
            .replace(/소멸할지니/g, '소멸할찌니');
    });
});

function normalizeTextForComparison(text) {
    return text

        // 눈으로는 똑같아 보이는 답이 글자가 빠진 것처럼 비교돼 오답 처리되는 원인이 된다.
        .normalize('NFC')
        // 공백뿐 아니라 쉼표/마침표/물음표 등 모든 문장부호·기호를 다 무시한다(한글/영문/숫자만 남김).
        // 이전에는 공백과 쉼표·괄호만 제거해서, 예를 들어 문장 끝에 마침표를 붙이거나
        // 스마트폰 자동 문장부호(예: 스페이스 두 번 → 마침표)가 들어가면 글자와 띄어쓰기가
        // 전부 맞아도 오답 처리되는 문제가 있었다.
        .replace(/[^가-힣a-zA-Z0-9]/g, '')
        .replace(/잠간/g, '잠깐')
        .replace(/찌/g, '지')
        .replace(/참예/g, '참여')
        .replace(/세째/g, '셋째') // '세째'를 '셋째'로 통일
        .replace(/네째/g, '넷째') // '네째'를 '넷째'로 통일
        .replace(/비췸/g, '비침') // '비췸'(고어)을 '비침'으로 통일
        .replace(/쌔/g, '새') // '~ㄹ쌔'(고어)를 '~ㄹ새'로 통일
        .replace(/찐/g, '진') // '찐저'(고어)를 '진저'로 통일
        .replace(/앎으로/g, '알므로') // '앎으로'와 '알므로' 동일 인정
        .replace(/륙/g, '육') // '륙'(두음법칙 이전 표기)을 '육'으로 통일
        .replace(/두째/g, '둘째'); // '두째'(사투리)를 '둘째'로 통일
}

function formatTime(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes}:${seconds.toString().padStart(2, '0')}`;
}

// 큰 화면(노트북) 레이아웃 스위치 — 계시록 통달/초중고 신학과 같은 목적. 선택값은 localStorage에
// 저장해서 다음에 다시 들어와도 유지된다. 기존 세로형 레이아웃 마크업/클래스는 그대로 두고,
// #main-app에 layout-desktop 클래스만 추가로 붙여서(위 <style>의 별도 CSS로) 전환한다.
const MEMOROOM_LAYOUT_KEY = 'sion_memoroom_studylayout';
function getMemoRoomLayout() {
    try { return localStorage.getItem(MEMOROOM_LAYOUT_KEY) === 'desktop' ? 'desktop' : 'mobile'; }
    catch (e) { return 'mobile'; }
}
function applyMemoRoomLayout(mode) {
    const app = document.getElementById('main-app');
    const icon = document.getElementById('layout-toggle-icon');
    const label = document.getElementById('layout-toggle-label');
    if (app) app.classList.toggle('layout-desktop', mode === 'desktop');
    if (icon) icon.textContent = mode === 'desktop' ? '📱' : '🖥️';
    if (label) label.textContent = mode === 'desktop' ? ' 모바일 화면' : ' 큰 화면';
}
function toggleMemoRoomLayout() {
    const next = getMemoRoomLayout() === 'desktop' ? 'mobile' : 'desktop';
    try { localStorage.setItem(MEMOROOM_LAYOUT_KEY, next); } catch (e) { /* 무시 */ }
    applyMemoRoomLayout(next);
}

    let chapterTimerInterval = null;
    let chapterStartTime = null;

    // ─────────────────────────────────────────────────────────
    // 학습 진도 저장 (이 기기의 localStorage에만 저장, 서버 연동 없음)
    // ─────────────────────────────────────────────────────────
    const MEMO_ROOM_PROGRESS_KEY = 'sion_progress_memoroom';
    const MEMO_ROOM_TOTAL_CHAPTERS = 22;

    function loadMemoRoomProgress() {
        try {
            const raw = JSON.parse(localStorage.getItem(MEMO_ROOM_PROGRESS_KEY));
            return { completed: (raw && Array.isArray(raw.completed)) ? raw.completed : [], last: (raw && raw.last) || null };
        } catch (e) { return { completed: [], last: null }; }
    }

    function saveMemoRoomProgress(progress) {
        try { localStorage.setItem(MEMO_ROOM_PROGRESS_KEY, JSON.stringify(progress)); } catch (e) { /* 저장 실패는 무시 */ }
    }

    // 장을 선택할 때마다(완료 여부와 무관하게) "마지막으로 보던 위치"를 저장한다.
    // (이어서 하기 버튼 자체는 아래 getMemoRoomResumeTarget()이 완료 기록을 근거로 다시
    //  계산하므로, 이 값은 참고용일 뿐 버튼 목적지에 직접 쓰이지 않는다 — 완료한 장을
    //  나중에 다시 열람만 해도 이어서 하기가 그 장으로 뒷걸음질치는 것을 막기 위함.)
    function markMemoRoomLastChapter(chapterNumber) {
        const progress = loadMemoRoomProgress();
        progress.last = chapterNumber;
        saveMemoRoomProgress(progress);
        renderMemoRoomProgressPanel();
    }

    // "장 전체 암송" 채점을 마치면 그 장을 "완료"로 기록한다.
    function markMemoRoomChapterCompleted(chapterNumber) {
        const progress = loadMemoRoomProgress();
        if (!progress.completed.includes(chapterNumber)) progress.completed.push(chapterNumber);
        progress.last = chapterNumber;
        saveMemoRoomProgress(progress);
        renderMemoRoomProgressPanel();
    }

    // "이어서 하기"가 가리킬 장을 완료 기록으로 계산한다: 아직 완료하지 못한 장 중 가장 앞선 장.
    // 모두 완료했다면 null.
    function getMemoRoomResumeTarget() {
        const progress = loadMemoRoomProgress();
        const completedSet = new Set(progress.completed);
        for (let i = 1; i <= MEMO_ROOM_TOTAL_CHAPTERS; i++) {
            if (!completedSet.has(i)) return i;
        }
        return null;
    }

    // "진도 초기화": 완료 기록을 모두 지운다. (채점 기록/이력은 별도이므로 남겨둔다.)
    // inline onclick에서 호출되므로 window에 노출해야 한다.
    window.resetMemoRoomProgress = function() {
        if (!confirm('요한계시록 완벽 암기 학습 진도를 초기화할까요?\n완료 기록이 모두 지워집니다.')) return;
        try { localStorage.removeItem(MEMO_ROOM_PROGRESS_KEY); } catch (e) { /* 무시 */ }
        renderMemoRoomProgressPanel();
    };

    // 상단에 진도율 + "이어서 하기" 배너를 그린다.
    function renderMemoRoomProgressPanel() {
        const panel = document.getElementById('memo-progress-panel');
        if (!panel) return;
        const progress = loadMemoRoomProgress();
        const doneCount = progress.completed.length;
        const percent = Math.round((doneCount / MEMO_ROOM_TOTAL_CHAPTERS) * 100);
        const target = getMemoRoomResumeTarget();

        let resumeHtml = '';
        if (target) {
            resumeHtml = `
            <button onclick="resumeMemoRoomProgress()" class="w-full mt-3 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl py-3 font-black text-[14px] shadow-md active:scale-95 transition-transform">
                ▶ 이어서 하기 (${target}장부터)
            </button>`;
        } else if (doneCount >= MEMO_ROOM_TOTAL_CHAPTERS) {
            resumeHtml = `
            <div class="w-full mt-3 bg-emerald-50 text-emerald-700 rounded-2xl py-3 font-black text-[13px] text-center">
                🎉 22장을 모두 완료했습니다!
            </div>`;
        }

        const resetHtml = (doneCount > 0) ? `
            <button onclick="resetMemoRoomProgress()" class="w-full mt-2 bg-white hover:bg-rose-50 text-rose-500 border border-rose-200 rounded-xl py-2 text-[12px] font-black active:scale-95 transition-transform">
                진도 초기화
            </button>` : '';

        panel.innerHTML = `
            <div class="w-full bg-white border-2 border-teal-100 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between text-[12px] font-black text-slate-500 mb-2">
                    <span>학습 진도</span>
                    <span class="text-teal-600">${doneCount}/${MEMO_ROOM_TOTAL_CHAPTERS}장 완료</span>
                </div>
                <div class="w-full h-2.5 bg-teal-50 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-teal-400 to-teal-600 rounded-full transition-all" style="width:${percent}%"></div>
                </div>
                ${resumeHtml}
                ${resetHtml}
            </div>`;
    }

    // ─────────────────────────────────────────────────────────
    // "장 전체 암송" 채점 기록 (이 기기 localStorage에만 저장, 최근 30건)
    // 요약 정보뿐 아니라 절별 채점 상세(원문/내가 쓴 답/정오답)까지 저장해두어
    // 나중에 "불러오기"로 그 회차의 채점 화면을 다시 재현할 수 있게 한다.
    // ─────────────────────────────────────────────────────────
    const MEMO_ROOM_HISTORY_KEY = 'sion_memoroom_chapter_history';

    function nowStrMemoRoom() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function loadMemoRoomChapterHistory() {
        try { return JSON.parse(localStorage.getItem(MEMO_ROOM_HISTORY_KEY)) || []; } catch (e) { return []; }
    }

    function saveMemoRoomChapterHistoryEntry(entry) {
        try {
            const list = loadMemoRoomChapterHistory();
            list.unshift(entry);
            localStorage.setItem(MEMO_ROOM_HISTORY_KEY, JSON.stringify(list.slice(0, 30)));
        } catch (e) { /* 저장 실패는 무시 (시크릿 모드 등) */ }
        renderMemoRoomChapterHistoryList();
    }

    // 장이 뒤섞여 보이지 않도록, 전체 목록(최신순)을 장 번호별로 묶어서 보여준다.
    // 항목의 idx는 loadMemoRoomChapterHistory()가 돌려주는 원래 배열의 위치를 그대로 가리켜야
    // 불러오기/삭제가 정확한 기록을 찾으므로, 묶을 때도 그 원래 idx를 같이 들고 다닌다.
    function renderMemoRoomChapterHistoryList() {
        const section = document.getElementById('memo-room-history-section');
        const listEl = document.getElementById('memo-room-history-list');
        if (!section || !listEl) return;
        const list = loadMemoRoomChapterHistory();
        if (!list.length) { section.classList.add('hidden'); return; }
        section.classList.remove('hidden');

        const byChapter = {};
        list.forEach((h, idx) => {
            if (!byChapter[h.chapter]) byChapter[h.chapter] = [];
            byChapter[h.chapter].push({ h, idx });
        });
        const chapters = Object.keys(byChapter).map(Number).sort((a, b) => a - b);

        listEl.innerHTML = chapters.map(ch => {
            const entries = byChapter[ch];
            const rows = entries.map(({ h, idx }) => `
                <div class="flex items-center bg-slate-50 border border-slate-100 rounded-xl pl-3 pr-1 py-1 text-[11px] font-bold gap-2">
                    <button onclick="loadMemoRoomChapterHistoryEntry(${idx})" class="flex items-center gap-2 flex-grow min-w-0 text-left py-1.5 hover:opacity-70 transition-opacity">
                        <span class="text-slate-500 flex-shrink-0">${h.takenAt || ''}</span>
                        <span class="${(h.score || 0) >= 90 ? 'text-emerald-600' : 'text-rose-500'} flex-grow">${h.score}점</span>
                        <span class="text-teal-500 flex-shrink-0">📂 불러오기</span>
                    </button>
                    <button onclick="deleteMemoRoomChapterHistoryEntry(${idx})" class="text-slate-300 hover:text-rose-500 transition-colors flex-shrink-0 px-2" aria-label="이 기록 삭제">✕</button>
                </div>
            `).join('');
            return `
                <div class="mb-3 last:mb-0">
                    <p class="text-[11px] font-black text-teal-600 mb-1">계 ${ch}장 <span class="text-slate-300 font-bold">(${entries.length}회)</span></p>
                    <div class="space-y-1.5">${rows}</div>
                </div>`;
        }).join('');
    }

    // 아래 4개 함수는 innerHTML로 그린 버튼의 inline onclick="..."에서 호출된다.
    // inline onclick은 전역 스코프에서 이름을 찾으므로, 이 DOMContentLoaded 클로저 안에
    // function으로만 선언하면 "정의되지 않음" 오류로 조용히 아무 반응이 없다 — window에 노출해야 한다.
    window.deleteMemoRoomChapterHistoryEntry = function(idx) {
        const list = loadMemoRoomChapterHistory();
        list.splice(idx, 1);
        localStorage.setItem(MEMO_ROOM_HISTORY_KEY, JSON.stringify(list));
        renderMemoRoomChapterHistoryList();
    };

    window.clearMemoRoomChapterHistory = function() {
        localStorage.removeItem(MEMO_ROOM_HISTORY_KEY);
        renderMemoRoomChapterHistoryList();
    };

    // "불러오기": 저장된 채점 기록으로 그 장의 입력칸을 다시 채우고(읽기 전용),
    // 절별 정오답 표시 + 채점 결과 요약까지 그대로 재현한다. 다운로드 없이 다시 열람 가능.
    window.loadMemoRoomChapterHistoryEntry = function(idx) {
        const list = loadMemoRoomChapterHistory();
        const entry = list[idx];
        if (!entry || !entry.verses) return;

        chapterSelect.value = String(entry.chapter);
        setMode('chapter');
        handleChapterChange();
        stopChapterTimer(); // 불러온 기록은 지금 응시 중이 아니므로 실시간 타이머를 멈추고 저장된 시간을 보여준다

        // handleChapterChange가 다시 그린 빈 입력칸에, 저장된 절별 답과 채점 결과를 채운다.
        entry.verses.forEach((v, index) => {
            const input = chapterInputContainer.querySelector(`.chapter-verse-input[data-verse-index="${index}"]`);
            if (input) {
                input.value = v.userText || '';
                input.readOnly = true;
                input.classList.add('bg-slate-50');
                input.style.height = 'auto';
                input.style.height = `${input.scrollHeight}px`;
            }
            const marker = chapterInputContainer.querySelector(`.verse-number-marker[data-verse-index="${index}"]`);
            if (marker) {
                marker.classList.remove('correct', 'incorrect');
                if ((v.userText || '').trim() !== '') marker.classList.add(v.correct ? 'correct' : 'incorrect');
            }
            const resultDisplay = chapterInputContainer.querySelector(`.chapter-result-display[data-verse-index="${index}"]`);
            if (resultDisplay) {
                const html = getDiffHTML(v.originalText, v.userText || '');
                resultDisplay.innerHTML = html || '<em>입력 없음</em>';
            }
        });

        scoreValue.textContent = entry.score;
        correctCount.textContent = entry.numCorrect;
        totalCount.textContent = entry.totalVerses;
        scoreDisplay.classList.remove('hidden');
        chapterMessageArea.classList.remove('hidden');
        chapterInstruction.classList.add('hidden');
        chapterEncouragement.textContent = `불러온 기록 (${entry.takenAt || ''})`;
        chapterEncouragement.classList.remove('hidden');
        pdfDownloadContainer.classList.remove('hidden');
        if (timerValue) timerValue.textContent = entry.elapsedText || '0:00';

        memorizeSection.scrollIntoView({ behavior: 'smooth' });
    };

    // "이어서 하기" 버튼: 아직 완료하지 못한 가장 앞선 장으로 select 값을 옮기고 그 지점부터 시작한다.
    window.resumeMemoRoomProgress = function() {
        const target = getMemoRoomResumeTarget();
        if (!target) return;
        chapterSelect.value = String(target);
        handleChapterChange();
        memorizeSection.scrollIntoView({ behavior: 'smooth' });
    };

    // Initialize
    function initialize() {
        // Populate chapter select options
        revelationData.forEach(chapterData => {
            const option = document.createElement('option');
            option.value = chapterData.chapter;
            option.textContent = `${chapterData.chapter}장`;
            chapterSelect.appendChild(option);
        });

        // Event Listeners
        chapterSelect.addEventListener('change', handleChapterChange);
        verseModeBtn.addEventListener('click', () => setMode('verse'));
        chapterModeBtn.addEventListener('click', () => setMode('chapter'));

        prevChapterBtn.addEventListener('click', () => navigateChapter(-1));
        nextChapterBtn.addEventListener('click', () => navigateChapter(1));
        userInput.addEventListener('keydown', handleUserInput);
        prevVerseBtn.addEventListener('click', () => navigateVerse(-1));
        nextVerseBtn.addEventListener('click', () => navigateVerse(1));
        toggleOriginalBtn.addEventListener('click', toggleOriginalText);
        if (chapterAudioPlayBtn) chapterAudioPlayBtn.addEventListener('click', toggleChapterReadAloud);
        if (chapterAudioStopBtn) chapterAudioStopBtn.addEventListener('click', stopChapterReadAloud);
        if (chapterAudioRateSelect) chapterAudioRateSelect.addEventListener('change', (e) => {
            chapterTts.rate = parseFloat(e.target.value) || 1;
        });
        checkChapterBtn.addEventListener('click', compareText);
        if (checkChapterBtnTop) checkChapterBtnTop.addEventListener('click', compareText);
        downloadPdfBtn.addEventListener('click', generateResultPdf);
        modalCloseBtn.addEventListener('click', () => resultModal.classList.add('hidden'));
        modalCloseBtnX.addEventListener('click', () => resultModal.classList.add('hidden'));
        
        // Blank Practice Event Listener
        startBlankPracticeBtn.addEventListener('click', generateBlankPuzzle);
        
        setMode('verse'); // 초기 모드를 '절별 암송'으로 설정
        updateChapterNavigationButtons();
        renderMemoRoomProgressPanel();
        renderMemoRoomChapterHistoryList();
    }

    // ... existing code (timer functions, handleChapterChange, populateVerseSelectionGrid, setMode, updateModeButtons) ...
     function startChapterTimer() {
        resetChapterTimer();
        chapterStartTime = Date.now();
        timerValue.textContent = '0:00';
        timerDisplay.classList.remove('hidden');
        chapterTimerInterval = setInterval(() => {
            const elapsedSeconds = Math.floor((Date.now() - chapterStartTime) / 1000);
            timerValue.textContent = formatTime(elapsedSeconds);
        }, 1000);
    }

    function stopChapterTimer() {
        if (chapterTimerInterval) {
            clearInterval(chapterTimerInterval);
            chapterTimerInterval = null;
        }
    }

    function resetChapterTimer() {
        stopChapterTimer();
        timerDisplay.classList.add('hidden');
        chapterStartTime = null;
    }

    function handleChapterChange() {
        const chapterNumber = parseInt(chapterSelect.value);
        if (!chapterNumber) {
            memorizeSection.classList.add('hidden');
            verseSelectionContainer.classList.add('hidden');
            updateChapterNavigationButtons();
            return;
        }
        markMemoRoomLastChapter(chapterNumber);
        currentChapter = revelationData.find(c => c.chapter === chapterNumber);
        currentVerseIndex = 0;

    // ===== 장 전체 암송 - 오디오 낭독 =====
    // 절 번호는 TTS가 고유어(한, 두, 세)로 잘못 읽지 않도록 한자어 숫자로 직접 풀어쓴다.
    function sinoKorean(n) {
        if (n === 0) return '영';
        const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
        const units = ['', '십', '백', '천'];
        const str = String(n);
        let s = '';
        for (let i = 0; i < str.length; i++) {
            const d = +str[i];
            const place = str.length - i - 1;
            if (d === 0) continue;
            if (place === 0) s += digits[d];
            else s += (d === 1 ? '' : digits[d]) + units[place];
        }
        return s || '영';
    }
    function getCalmKoreanVoice() {
        if (!('speechSynthesis' in window)) return null;
        if (chapterTts.voiceLoaded) return chapterTts.voice;
        const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ko'));
        if (!voices.length) return null;
        chapterTts.voice = voices[0];
        chapterTts.voiceLoaded = true;
        return chapterTts.voice;
    }
    function buildChapterVerseSegments(verse) {
        return [
            { text: `${sinoKorean(verse.verse)}절`, pauseAfter: 300 },
            { text: verse.text, pauseAfter: 280 },
        ];
    }
    function speakChapterSegments(segments, segIdx, onDone) {
        if (!chapterTts.playing) return;
        if (segIdx >= segments.length) { onDone(); return; }
        const seg = segments[segIdx];
        const utterance = new SpeechSynthesisUtterance(seg.text);
        utterance.lang = 'ko-KR';
        utterance.rate = chapterTts.rate * 0.85; // 차분하고 편안하게 들리도록 기본 속도를 낮춘다
        utterance.pitch = 1.0;
        const voice = getCalmKoreanVoice();
        if (voice) utterance.voice = voice;
        utterance.onend = () => {
            if (!chapterTts.playing) return;
            chapterTts.pauseTimer = setTimeout(() => {
                speakChapterSegments(segments, segIdx + 1, onDone);
            }, seg.pauseAfter || 200);
        };
        utterance.onerror = () => { stopChapterReadAloud(); };
        speechSynthesis.speak(utterance);
    }
    function speakChapterFrom(idx) {
        if (!chapterTts.playing) return;
        const verse = currentChapter && currentChapter.verses[idx];
        if (!verse) { stopChapterReadAloud(); return; }
        chapterTts.index = idx;
        if (chapterAudioStatus) chapterAudioStatus.textContent = `${idx + 1} / ${currentChapter.verses.length}절 읽는 중`;
        speakChapterSegments(buildChapterVerseSegments(verse), 0, () => {
            if (chapterTts.playing) speakChapterFrom(idx + 1);
        });
    }
    function toggleChapterReadAloud() {
        if (!('speechSynthesis' in window)) return;
        if (chapterTts.playing) { stopChapterReadAloud(); return; }
        if (memorizationMode !== 'chapter' || !currentChapter) return;
        chapterTts.playing = true;
        if (chapterAudioPlayBtn) chapterAudioPlayBtn.querySelector('span').textContent = '읽는 중…';
        speakChapterFrom(0);
    }
    function stopChapterReadAloud() {
        if (chapterTts.pauseTimer) { clearTimeout(chapterTts.pauseTimer); chapterTts.pauseTimer = null; }
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        chapterTts.playing = false;
        chapterTts.index = -1;
        if (chapterAudioPlayBtn) chapterAudioPlayBtn.querySelector('span').textContent = '장 전체 듣기';
        if (chapterAudioStatus) chapterAudioStatus.textContent = '차분한 목소리로 전체를 이어 읽어드려요';
    }

    function getDiffHTML(originalText, userText) {
        // NFC로 먼저 맞춰서, 자소가 분리된(NFD) 입력이 정답과 글자 단위로 어긋나 보이며
        // 틀린 것처럼 밑줄이 그이는 걸 방지한다(정답/오답 판정 자체는 normalizeTextForComparison가
        // 이미 하고, 여기는 그 결과를 보여주는 글자 단위 비교 표시일 뿐).
        const s1 = originalText.normalize('NFC').replace(/\s+/g, '');
        const s2 = userText.normalize('NFC').replace(/\s+/g, '');
        if (!s1 && !s2) return userText.trim() === '' ? '&nbsp;' : '';
        const dp = Array(s1.length + 1).fill(null).map(() => Array(s2.length + 1).fill(0));
        for (let i = 1; i <= s1.length; i++) {
            for (let j = 1; j <= s2.length; j++) {
                if (s1[i - 1] === s2[j - 1]) {
                    dp[i][j] = dp[i - 1][j - 1] + 1;
                } else {
                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }
        }
        const diff = [];
        let i = s1.length, j = s2.length;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && s1[i - 1] === s2[j - 1]) {
                diff.unshift({ type: 'common', value: s1[i - 1] });
                i--; j--;
            } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                diff.unshift({ type: 'added', value: s2[j - 1] });
                j--;
            } else if (i > 0 && (j === 0 || dp[i][j - 1] < dp[i - 1][j])) {
                diff.unshift({ type: 'removed', value: s1[i - 1] });
                i--;
            } else {
                break; 
            }
        }
        let resultHTML = '';
        for (const part of diff) {
            const escapedValue = part.value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            if (part.type === 'common') resultHTML += escapedValue;
            else if (part.type === 'added') resultHTML += `<span class="highlight-red">${escapedValue}</span>`;
            else if (part.type === 'removed') resultHTML += `<span class="highlight-blue">${escapedValue}</span>`;
        }
        return resultHTML;
    }

    function compareText() {
        if (memorizationMode === 'verse') {
            const originalFullText = currentChapter.verses[currentVerseIndex].text;
            const userFullText = userInput.value;
            const resultHTML = getDiffHTML(originalFullText, userFullText);
            resultText.innerHTML = resultHTML || '&nbsp;';
            const feedbackContainer = document.getElementById('verse-result-feedback');
            const normalizedOriginal = normalizeTextForComparison(originalFullText);
            const normalizedUser = normalizeTextForComparison(userFullText);
            const isCorrect = normalizedOriginal === normalizedUser;
            if (isCorrect && userFullText.trim() !== '') {
                feedbackContainer.innerHTML = `<p class="text-xl font-bold text-emerald-600 animate-bounce">정답입니다!</p>`;
            } else {
                feedbackContainer.innerHTML = '';
            }
            resultContainer.classList.remove('hidden');
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        } else { // Chapter mode
            stopChapterTimer();
            markMemoRoomChapterCompleted(currentChapter.chapter);
            resultContainer.classList.add('hidden');
            const verseInputs = chapterInputContainer.querySelectorAll('.chapter-verse-input');

            const dataVerses = currentChapter.verses;
            const totalVerses = dataVerses.length;
            
            let numCorrect = 0;
            const incorrectVersesData = [];
            const allVersesData = [];

            verseInputs.forEach((input, index) => {
                const userVerseText = input.value;
                const verseData = dataVerses[index];
                const originalVerseText = verseData.text;

                const normalizedOriginal = normalizeTextForComparison(originalVerseText);
                const normalizedUser = normalizeTextForComparison(userVerseText);
                const isCorrect = (normalizedOriginal === normalizedUser) && (userVerseText.trim() !== '');

                const verseNumberMarker = chapterInputContainer.querySelector(`.verse-number-marker[data-verse-index="${index}"]`);
                if (verseNumberMarker) {
                    verseNumberMarker.classList.remove('correct', 'incorrect');
                    if (userVerseText.trim() !== '') {
                        verseNumberMarker.classList.add(isCorrect ? 'correct' : 'incorrect');
                    }
                }

                if(isCorrect) {
                    numCorrect++;
                } else {
                    const reference = `계 ${currentChapter.chapter}:${verseData.verse}`;

                    incorrectVersesData.push({
                        reference: reference,
                        verse: verseData.verse,
                        userText: userVerseText,
                        originalText: originalVerseText
                    });
                }
                allVersesData.push({ verse: verseData.verse, userText: userVerseText, originalText: originalVerseText, correct: isCorrect });

                const resultHTML = getDiffHTML(originalVerseText, userVerseText);
                const resultDisplay = chapterInputContainer.querySelector(`.chapter-result-display[data-verse-index="${index}"]`);
                if (resultDisplay) {
                    resultDisplay.innerHTML = resultHTML || '<em>입력 없음</em>';
                }
            });

            const scorePercentage = totalVerses > 0 ? Math.ceil((numCorrect / totalVerses) * 100) : 0;
            scoreValue.textContent = scorePercentage;
            correctCount.textContent = numCorrect;
            totalCount.textContent = totalVerses;
            scoreDisplay.classList.remove('hidden');
            chapterMessageArea.classList.remove('hidden');
            chapterInstruction.classList.add('hidden');
            chapterEncouragement.textContent = '수고하셨습니다';
            chapterEncouragement.classList.remove('hidden');
            pdfDownloadContainer.classList.remove('hidden');
            showResultModal(scorePercentage, incorrectVersesData);

            // 다시 볼 때 필요한 절별 상세(원문/내가 쓴 답/정오답)까지 함께 저장해
            // "최근 암송 기록"에서 "불러오기"로 이 채점 화면을 다시 열어볼 수 있게 한다.
            saveMemoRoomChapterHistoryEntry({
                chapter: currentChapter.chapter,
                score: scorePercentage,
                numCorrect,
                totalVerses,
                takenAt: nowStrMemoRoom(),
                elapsedText: timerValue ? timerValue.textContent : '',
                verses: allVersesData
            });
        }
    }

                </div>
                <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px; background-color: #f8fafc; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px;">
                    <div style="text-align: center;"><p style="font-size: 24px; font-weight: bold; color: #0d9488; margin:0;">${scoreValue.textContent}점</p><p style="font-size: 12px; color: #64748b; margin:0;">(${correctCount.textContent} / ${totalCount.textContent} 맞음)</p></div>
                    ${timerHTML}
                </div>`;
            
            renderArea.innerHTML = headerHTML;
            const headerCanvas = await html2canvas(renderArea, { scale: 2 });
            const headerImgData = headerCanvas.toDataURL('image/png');
            const headerImgProps = pdf.getImageProperties(headerImgData);
            const headerImgHeightMM = (headerImgProps.height * pdfContentWidthMM) / headerImgProps.width;

            let currentY = marginMM;
            pdf.addImage(headerImgData, 'PNG', marginMM, currentY, pdfContentWidthMM, headerImgHeightMM);
            currentY += headerImgHeightMM;
            
            // --- 2. Generate individual verse content elements ---
            const verseHTMLs = [];

            currentChapter.verses.forEach((verse, index) => {
                const resultDisplay = chapterInputContainer.querySelector(`.chapter-result-display[data-verse-index="${index}"]`);
                const resultHTML = resultDisplay ? resultDisplay.innerHTML : '<em>입력 없음</em>';
                const verseNumberMarker = chapterInputContainer.querySelector(`.verse-number-marker[data-verse-index="${index}"]`);
                let markerSymbol = '';
                if (verseNumberMarker) {
                    if (verseNumberMarker.classList.contains('correct')) markerSymbol = '<span style="color: #10b981; font-size: 1.2em; font-weight: bold; margin-left: 5px;"> O</span>';
                    else if (verseNumberMarker.classList.contains('incorrect')) markerSymbol = '<span style="color: #ef4444; font-size: 1.2em; font-weight: bold; margin-left: 5px;"> X</span>';
                }

                const label = `${verse.verse}.`;

                verseHTMLs.push(`<div style="display: flex; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;"><div style="font-weight: bold; width: 45px; flex-shrink: 0; display: flex; align-items: center; color: #64748b;"><span>${label}</span>${markerSymbol}</div><div style="flex-grow: 1; font-size: 13px; line-height: 1.6; color: #334155;">${resultHTML}</div></div>`);
            });

            // --- 3. Add verse contents page by page ---
            for (const verseHTML of verseHTMLs) {
                renderArea.innerHTML = styles + verseHTML;
                const itemCanvas = await html2canvas(renderArea, { scale: 2 });
                const itemImgData = itemCanvas.toDataURL('image/png');
                const itemImgProps = pdf.getImageProperties(itemImgData);
                const itemImgHeightMM = (itemImgProps.height * pdfContentWidthMM) / itemImgProps.width;

                if (currentY + itemImgHeightMM > pdfContentHeightMM + marginMM) {
                    pdf.addPage();
                    currentY = marginMM;
                }

                pdf.addImage(itemImgData, 'PNG', marginMM, currentY, pdfContentWidthMM, itemImgHeightMM);
                currentY += itemImgHeightMM;
            }
            
            document.body.removeChild(renderArea);
            const fileName = `계시록_${currentChapter.chapter}장_채점결과.pdf`;
            pdf.save(fileName);

        } catch (error) {
            console.error("Result PDF generation failed:", error);
            alert("채점 결과 PDF를 생성하는 데 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
        } finally {
            downloadPdfBtn.disabled = false;
            downloadPdfBtn.innerHTML = originalButtonContent;
        }
    }
    
    // Blank Practice Logic
    function generateBlankPuzzle() {
        blankPracticeArea.classList.remove('hidden');
        blankPuzzleFeedback.textContent = '';
        const verseText = currentChapter.verses[currentVerseIndex].text;
        const words = verseText.split(' ');
        
        // Determine number of blanks (4-5, but not more than total words)
        let numBlanks = Math.floor(Math.random() * 2) + 4; // 4 or 5
        if (numBlanks > words.length) numBlanks = words.length;

        // Get random indices
        const indices = new Set();
        while(indices.size < numBlanks) {
            indices.add(Math.floor(Math.random() * words.length));
        }

        blankPuzzleContent.innerHTML = '';

        words.forEach((word, index) => {
            // Check for punctuation at the end to separate it
            const match = word.match(/^(.+?)([\.,;:"'\)]*)$/);
            const coreWord = match ? match[1] : word;
            const punctuation = match ? match[2] : '';

            if (indices.has(index)) {
                // Create input
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'blank-input';
                input.dataset.answer = coreWord;
                // Placeholder circles
                input.placeholder = '○'.repeat(coreWord.length);
                // Width adjustment
                const widthMultiplier = 18; // approx px per char
                input.style.width = `${coreWord.length * widthMultiplier + 10}px`;
                
                input.addEventListener('keydown', (e) => handleBlankInput(e, input));
                input.addEventListener('focus', () => blankPuzzleFeedback.textContent = '');

                blankPuzzleContent.appendChild(input);
                if (punctuation) {
                     const span = document.createElement('span');
                     span.textContent = punctuation;
                     blankPuzzleContent.appendChild(span);
                }
            } else {
                const span = document.createElement('span');
                span.textContent = word;
                blankPuzzleContent.appendChild(span);
            }
            // Add space
            if (index < words.length - 1) {
                const space = document.createTextNode(' ');
                blankPuzzleContent.appendChild(space);
            }
        });
        
        // Focus first input
        const firstInput = blankPuzzleContent.querySelector('input');
        if(firstInput) firstInput.focus();
    }
    
    function handleBlankInput(event, input) {
        if (event.key === 'Enter') {
            event.preventDefault();
            const userAnswer = input.value.trim();
            const correctAnswer = input.dataset.answer;
            
            const normalizedUser = normalizeTextForComparison(userAnswer);
            const normalizedCorrect = normalizeTextForComparison(correctAnswer);

            if (normalizedUser === normalizedCorrect) {
                // Correct
                input.classList.remove('incorrect');
                input.classList.add('correct');
                input.disabled = true; // Lock correct answer
                
                // Find next incomplete input
                const allInputs = Array.from(blankPuzzleContent.querySelectorAll('input'));
                const currentIndex = allInputs.indexOf(input);
                let nextInput = null;
                
                for (let i = currentIndex + 1; i < allInputs.length; i++) {
                    if (!allInputs[i].classList.contains('correct')) {
                        nextInput = allInputs[i];
                        break;
                    }
                }
                
                if (nextInput) {
                    nextInput.focus();
                    blankPuzzleFeedback.textContent = '정답입니다! 다음 빈칸을 채워보세요.';
                    blankPuzzleFeedback.className = 'mt-4 text-center h-8 font-bold text-emerald-600';
                } else {
                    // All finished - Auto regenerate
                    blankPuzzleFeedback.textContent = '참 잘했어요! 잠시 후 다음 문제가 시작됩니다.';
                    blankPuzzleFeedback.className = 'mt-4 text-center h-8 font-bold text-amber-500 text-xl';
                    
                    setTimeout(() => {
                        generateBlankPuzzle();
                    }, 1000);
                }
            } else {
                // Incorrect
                input.classList.add('incorrect');
                blankPuzzleFeedback.textContent = '틀렸습니다. 다시 시도해보세요.';
                blankPuzzleFeedback.className = 'mt-4 text-center h-8 font-bold text-red-500';
                setTimeout(() => input.classList.remove('incorrect'), 500);
            }
        }
    }
    
    initialize();

    // ─────────────────────────────────────────────────────────
    // 글자 크기 조절(돋보기 버튼): 기본/크게/아주 크게 3단계, localStorage에 저장해 다음 방문 때도 유지
    // (루트 index.html·다른 공부방과 같은 sion_font_scale 키를 공유해 사이트 전체에서 일관되게 유지된다)
    // ─────────────────────────────────────────────────────────
    const FONT_SCALE_KEY = 'sion_font_scale';
    const FONT_SCALE_MAX = 2;
    function loadFontScaleStage() {
        const n = parseInt(localStorage.getItem(FONT_SCALE_KEY), 10);
        return (Number.isInteger(n) && n >= 0 && n <= FONT_SCALE_MAX) ? n : 0;
    }
    function applyFontScaleStage(stage) {
        document.body.classList.remove('font-scale-1', 'font-scale-2');
        if (stage === 1) document.body.classList.add('font-scale-1');
        if (stage === 2) document.body.classList.add('font-scale-2');
    }
    window.changeFontScale = function(delta) {
        const next = Math.max(0, Math.min(FONT_SCALE_MAX, loadFontScaleStage() + delta));
        try { localStorage.setItem(FONT_SCALE_KEY, next); } catch (e) { /* 무시 */ }
        applyFontScaleStage(next);
    };
    window.resetFontScale = function() {
        try { localStorage.setItem(FONT_SCALE_KEY, 0); } catch (e) { /* 무시 */ }
        applyFontScaleStage(0);
    };
    applyFontScaleStage(loadFontScaleStage());
});
</script>
